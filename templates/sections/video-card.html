<div class="video-card reveal">
  <button type="button" class="video-embed" data-embed="{{embed_url}}" style="background-image:url('{{thumb_url}}')" aria-label="Play video{{#if title}}: {{title}}{{/if}}">
    <span class="video-embed__play" aria-hidden="true">
      <svg viewBox="0 0 68 48" width="68" height="48"><path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff0000"/><path d="M45 24 27 14v20z" fill="#ffffff"/></svg>
    </span>
  </button>
  {{#if title}}<h3 class="video-card__title">{{title}}</h3>{{/if}}
  {{#if description}}<p class="video-card__desc">{{description}}</p>{{/if}}
</div>
